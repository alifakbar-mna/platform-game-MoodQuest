<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angry Emotion Games - Gameplay</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/pageEmote_Angry-style.css">
</head>
<body>
    <!-- Fitur Pause Overlay -->
    <div id="pauseOverlay" class="pause-overlay" onclick="togglePause()">
        <div class="pause-content">
            <p class="pause-title">GAME PAUSED</p>
            <p class="pause-sub">Klik di mana saja untuk melanjutkan</p>
        </div>
    </div>
    
    <div class="game-container" id="arena-container">
        <!-- Tombol Pause Bentuk Awan di Pojok Kanan Atas -->
        <button class="pause-btn" onclick="event.stopPropagation(); togglePause();" title="Pause">
            <span class="pause-icon">||</span>
        </button>
        
        <!-- Scorecard di Pojok Kiri Bawah -->
        <div class="game-hud">
            <div>SCORE: <span id="score-val">0</span></div>
            <div>WAVE: <span id="wave-val">1/3</span></div>
        </div>

        <!-- Amunisi Api di Sebelah Kanan Mooru (Indikator Antrean) -->
        <div class="fire-queue" id="fire-queue-container">
            <img src="../image/angry/fire1.gif" class="queue-item" id="q-fire1" alt="Fire 1">
            <img src="../image/angry/fire2.gif" class="queue-item" id="q-fire2" alt="Fire 2">
            <img src="../image/angry/fire3.gif" class="queue-item" id="q-fire3" alt="Fire 3">
        </div>

        <!-- Area Gameplay untuk Spawn Proyektil & Demon -->
        <div id="battle-arena" class="battle-arena"></div>

        <!-- Maskot Utama Mooru Angry (Posisi Tengah Bawah, Tampak Belakang) -->
        <div class="mooru-angry-wrapper" id="mooru-container">
            <img src="../image/angry/mooru-angry.png" class="mooru-asset" id="mooru-asset" alt="Mooru Angry">
        </div>
    </div>

    <script>
        const arena = document.getElementById('battle-arena');
        const container = document.getElementById('arena-container');
        const mooru = document.getElementById('mooru-container');
        const mooruAsset = document.getElementById('mooru-asset');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const queueContainer = document.getElementById('fire-queue-container');

        // State & Variabel Utama Game
        let score = 0;
        let currentWave = 1;
        let gameActive = true;
        let isPaused = false;
        
        let demons = [];
        let projectiles = [];
        let explosions = [];
        
        let spawnTimer = 0;
        let currentFireIndex = 1; // Bergantian antara 1, 2, 3

        const waveConfigs = {
            1: { targetScore: 50, speed: 0.005, spawnRate: 120 },  // Speed bertahap via rasio (0 ke 1)
            2: { targetScore: 100, speed: 0.008, spawnRate: 90 },
            3: { targetScore: 200, speed: 0.012, spawnRate: 60 }
        };

        const explosionImages = [
            '../image/angry/explosion1.gif',
            '../image/angry/explosion2.gif'
        ];

        const fireImages = {
            1: '../image/angry/fire1.gif',
            2: '../image/angry/fire2.gif',
            3: '../image/angry/fire3.gif'
        };

        // --- SISTEM PENGATURAN ANTRIAN API (VISUAL SLIDE) ---
        function updateFireQueueVisual() {
            // Memindahkan posisi gambar sesuai urutan pemakaian
            const f1 = document.getElementById('q-fire1');
            const f2 = document.getElementById('q-fire2');
            const f3 = document.getElementById('q-fire3');
            
            if (currentFireIndex === 1) {
                f1.className = "queue-item active-fire";
                f2.className = "queue-item next-fire";
                f3.className = "queue-item reserve-fire";
            } else if (currentFireIndex === 2) {
                f2.className = "queue-item active-fire";
                f3.className = "queue-item next-fire";
                f1.className = "queue-item reserve-fire";
            } else {
                f3.className = "queue-item active-fire";
                f1.className = "queue-item next-fire";
                f2.className = "queue-item reserve-fire";
            }
        }

        // --- SPAWN DEMON (MUNCUL DARI JAUH) ---
        function spawnDemon() {
            if (!gameActive || isPaused) return;

            const el = document.createElement('img');
            el.src = '../image/angry/demon.png';
            el.classList.add('game-entity');
            arena.appendChild(el);

            // Koordinat asal di horizon tengah (X acak, Y konstan jauh di atas)
            const startX = Math.random() * 60 + 20; // 20% - 80% lebar layar
            const startY = 30; // Garis horizon atas dalam persen

            demons.push({
                element: el,
                progress: 0, // Berjalan dari 0 (jauh) ke 1 (menabrak layar/Mooru)
                startX: startX,
                startY: startY,
                endX: startX + (Math.random() * 20 - 10), // Sedikit bergeser menyebar saat maju
                endY: 85, // Titik depan mata Mooru
                size: 0,
                x: startX,
                y: startY
            });
        }

        // --- LOGIKA TEMBAK KE TITIK KOORDINAT (KLIK / SENTUH) ---
        container.addEventListener('click', (e) => {
            if (!gameActive || isPaused) return;
            // Cegah menembak jika tidak sengaja menekan tombol pause
            if (e.target.closest('.pause-btn')) return; 

            const rect = arena.getBoundingClientRect();
            const targetX = e.clientX - rect.left;
            const targetY = e.clientY - rect.top;

            // Dapatkan posisi asal tembakan (dari mulut/tengah badan Mooru)
            const mooruRect = mooru.getBoundingClientRect();
            const startX = (mooruRect.left + mooruRect.width / 2) - rect.left;
            const startY = (mooruRect.top + 30) - rect.top;

            // Animasi rotasi hadap Mooru sedikit miring ke arah klik
            const angle = Math.atan2(targetX - startX, startY - targetY) * (180 / Math.PI);
            mooruAsset.style.transform = `scale(1.1) rotate(${angle * 0.3}deg)`;
            setTimeout(() => { mooruAsset.style.transform = 'scale(1) rotate(0deg)'; }, 200);

            // Buat Proyektil Api
            const pEl = document.createElement('img');
            pEl.src = fireImages[currentFireIndex];
            pEl.classList.add('game-entity', 'projectile-fire');
            arena.appendChild(pEl);

            projectiles.push({
                element: pEl,
                x: startX,
                y: startY,
                tx: targetX,
                ty: targetY,
                speed: 15, // Kecepatan proyektil meluncur
                alive: true
            });

            // Rotasi indeks pemakaian api (1 -> 2 -> 3 -> 1)
            currentFireIndex = currentFireIndex === 3 ? 1 : currentFireIndex + 1;
            updateFireQueueVisual();
        });

        // --- GAME LOOP UTAMA (REQUEST ANIMATION FRAME UNTUK GERAKAN SEHALUS SUTRA) ---
        function updateGame() {
            if (gameActive && !isPaused) {
                const config = waveConfigs[currentWave];

                // 1. Manajerial Spawning Demon
                spawnTimer++;
                if (spawnTimer >= config.spawnRate) {
                    spawnDemon();
                    spawnTimer = 0;
                }

                // 2. Pergerakan Demon (Makin dekat makin besar & jelas)
                for (let i = demons.length - 1; i >= 0; i--) {
                    let d = demons[i];
                    d.progress += config.speed;

                    // Menggunakan perhitungan interpolasi linier (lerp) agar gerakan sangat halus
                    d.x = d.startX + (d.endX - d.startX) * d.progress;
                    d.y = d.startY + (d.endY - d.startY) * d.progress;
                    
                    // Skala ukuran dan opasitas membesar seiring progress mendekat
                    const currentSize = 30 + (120 * d.progress); // dari 30px ke 150px
                    d.element.style.width = `${currentSize}px`;
                    d.element.style.height = `${currentSize}px`;
                    d.element.style.left = `calc(${d.x}% - ${currentSize/2}px)`;
                    d.element.style.top = `calc(${d.y}% - ${currentSize/2}px)`;
                    d.element.style.opacity = 0.2 + (0.8 * d.progress);

                    // Kondisi jika Demon sukses lolos mendekat menduduki Mooru
                    if (d.progress >= 1) {
                        d.element.remove();
                        demons.splice(i, 1);
                        updateScore(-15); // Penalti poin jika kecolongan kemasukan musuh
                    }
                }

                // 3. Pergerakan Proyektil Api
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    let p = projectiles[i];
                    
                    const dx = p.tx - p.x;
                    const dy = p.ty - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > p.speed) {
                        p.x += (dx / dist) * p.speed;
                        p.y += (dy / dist) * p.speed;
                        p.element.style.left = `${p.x}px`;
                        p.element.style.top = `${p.y}px`;

                        // Cek Tabrakan Proyektil dengan para Demon di Udara
                        for (let j = demons.length - 1; j >= 0; j--) {
                            let d = demons[j];
                            
                            // Ambil posisi absolut pixel Demon di arena layar saat ini
                            const dLeft = d.element.offsetLeft;
                            const dTop = d.element.offsetTop;
                            const dSize = d.element.clientWidth;

                            const dCenterX = dLeft + dSize / 2;
                            const dCenterY = dTop + dSize / 2;

                            const hitDist = Math.sqrt(Math.pow(p.x - dCenterX, 2) + Math.pow(p.y - dCenterY, 2));
                            
                            // Area hitbox disesuaikan dinamis berdasarkan besarnya skala tubuh demon
                            if (hitDist < (dSize / 1.5)) {
                                createExplosion(dCenterX, dCenterY);
                                d.element.remove();
                                demons.splice(j, 1);
                                
                                p.element.remove();
                                p.alive = false;
                                projectiles.splice(i, 1);
                                
                                updateScore(10); // +10 poin ketika kena sasaran sesuai instruksi blueprint
                                break;
                            }
                        }
                    } else {
                        // Jika proyektil sampai di titik klik tanpa mengenai apapun
                        if (p.alive) {
                            p.element.remove();
                            projectiles.splice(i, 1);
                        }
                    }
                }
            }

            requestAnimationFrame(updateGame);
        }

        // --- EFEK LEDAKAN DI COORD TERKENA (RANDOM GIF) ---
        function createExplosion(x, y) {
            const exp = document.createElement('img');
            const randomGif = explosionImages[Math.floor(Math.random() * explosionImages.length)];
            exp.src = randomGif + '?t=' + Date.now(); // Bypass cache gif agar animasi mulai dari frame 0
            exp.classList.add('game-entity', 'explosion-effect');
            exp.style.left = `${x - 40}px`;
            exp.style.top = `${y - 40}px`;
            arena.appendChild(exp);

            setTimeout(() => { exp.remove(); }, 600); // Bersihkan sisa gif ledakan dalam 0.6 detik
        }

        // --- UPDATE SKOR & WAVE LOGIC ---
        function updateScore(amount) {
            score += amount;
            if (score < 0) score = 0;
            document.getElementById('score-val').innerText = score;

            const config = waveConfigs[currentWave];
            if (score >= config.targetScore) {
                if (currentWave < 3) {
                    currentWave++;
                    document.getElementById('wave-val').innerText = currentWave + '/3';
                    // Bersihkan musuh lama saat transisi ronde baru
                    demons.forEach(d => d.element.remove());
                    demons = [];
                } else {
                    gameActive = false;
                    alert("Luar Biasa! Amarah Mooru Terbalaskan, Kamu Menang!");
                    window.location.href = '../view/homePage.html';
                }
            }
        }

        // --- INTEGRASI TOMBOL PAUSE AWAN ---
        function togglePause() {
            if (!gameActive) return;
            isPaused = !isPaused;
            if (isPaused) {
                pauseOverlay.classList.add('active');
            } else {
                pauseOverlay.classList.remove('active');
            }
        }

        // Inisialisasi awal permainan
        updateFireQueueVisual();
        requestAnimationFrame(updateGame);
    </script>
</body>
</html>
