<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Emotion Games - Trial Mode</title>
    <link rel="stylesheet" href="../css/pageEmote_Happy-style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-hud">
            <div>SCORE: <span id="trial-score">0</span></div>
            <div>WAVE: 1/3</div>
        </div>

        <div class="sweets-bar-wrapper" id="trial-sweets-bar">
            <img src="../image/sweets_bar.png" class="sweets-bar-bg" alt="Sweets Bar">
            <div class="target-items-holder" id="trial-target-list">
                </div>
        </div>

        <div class="instruction-box">
            <h2 id="instruction-title">Langkah 1: Gerakan Mooru</h2>
            <p id="instruction-text">Gunakan tombol PANAH KANAN / KIRI pada keyboard untuk menggeser Mooru (nyam2.png) mendekati makanan!</p>
            <button id="next-step-btn" class="btn-next" style="display: none;">Lanjut</button>
        </div>

        <div id="score-float" class="score-float"></div>

        <div class="character-wrapper" id="trial-mooru-container">
            <img src="../image/nyam2(Happy).png" class="character" id="trial-mooru" alt="Mooru">
        </div>

        <div id="trial-arena"></div>

        <div class="nav-container">
            <a href="../view/pageEmote_Happy2.html" class="btn-main">Mulai Game Utama</a>
        </div>
    </div>

    <script>
        const mooruContainer = document.getElementById('trial-mooru-container');
        const mooruSprite = document.getElementById('trial-mooru');
        const sweetsBar = document.getElementById('trial-sweets-bar');
        const targetList = document.getElementById('trial-target-list');
        const nextBtn = document.getElementById('next-step-btn');
        const insTitle = document.getElementById('instruction-title');
        const insText = document.getElementById('instruction-text');
        const trialArena = document.getElementById('trial-arena');
        const trialScoreVal = document.getElementById('trial-score');
        const scoreFloat = document.getElementById('score-float');

        let currentPos = 50; 
        let currentStep = 1;
        let hasMoved = false;
        let trialFoodTimer;

        // Inisialisasi 4 item acak untuk bar tutorial
        const allItems = ['../image/item1.png', '../image/item2.png', '../image/item3.png', '../image/item4.png', '../image/item5.png', '../image/item6.png'];
        const trialTargets = [...allItems].sort(() => 0.5 - Math.random()).slice(0, 4);
        
        trialTargets.forEach(src => {
            const img = document.createElement('img');
            img.src = src;
            img.classList.add('target-item-pic');
            targetList.appendChild(img);
        });

        // Kontrol Gerakan Langkah 1 & Langkah 4
        document.addEventListener('keydown', (e) => {
            if (currentStep === 1 || currentStep === 4) {
                if (e.key === 'ArrowLeft' && currentPos > 20) {
                    currentPos -= 5;
                    hasMoved = true;
                } else if (e.key === 'ArrowRight' && currentPos < 80) {
                    currentPos += 5;
                    hasMoved = true;
                }
                mooruContainer.style.left = currentPos + '%';

                if (currentStep === 1 && hasMoved) {
                    nextBtn.style.display = 'inline-block';
                }
            }
        });

        nextBtn.addEventListener('click', () => {
            currentStep++;
            if (currentStep === 2) {
                insTitle.innerText = "Langkah 2: Perhatikan Target";
                insText.innerText = "Lihat bar di kiri atas (sweets_bar.png). Mooru hanya boleh memakan 4 makanan acak yang tertera di sana!";
                sweetsBar.classList.add('highlight-bar');
                nextBtn.style.display = 'inline-block';
            } else if (currentStep === 3) {
                sweetsBar.classList.remove('highlight-bar');
                insTitle.innerText = "Langkah 3: Perhitungan Poin";
                insText.innerText = "Jika BENAR memakan item target: +5 Poin. Jika SALAH memakan atau target LOLOS: -5 Poin!";
                nextBtn.style.display = 'inline-block';
            } else if (currentStep === 4) {
                insTitle.innerText = "Langkah 4: Uji Coba Makan";
                insText.innerText = "Ayo coba tangkap makanan yang jatuh sekarang!";
                nextBtn.style.display = 'none';
                startTrialSpawning();
            }
        });

        function startTrialSpawning() {
            trialFoodTimer = setInterval(() => {
                const isTarget = Math.random() > 0.5;
                const foodSrc = isTarget ? trialTargets[0] : allItems.find(x => !trialTargets.includes(x));
                
                const food = document.createElement('img');
                food.src = foodSrc;
                food.classList.add('falling-food');
                food.style.left = (Math.random() * (75 - 25) + 25) + '%';
                food.style.top = '0px';
                trialArena.appendChild(food);

                let topPos = 0;
                let fall = setInterval(() => {
                    topPos += 4;
                    food.style.top = topPos + 'px';

                    let arenaH = trialArena.clientHeight || 400;
                    if (topPos >= arenaH - 120 && topPos <= arenaH - 60) {
                        let foodX = parseFloat(food.style.left);
                        if (Math.abs(foodX - currentPos) < 8) {
                            clearInterval(fall);
                            food.remove();
                            
                            // Feedback Visual sesuai Request
                            if (isTarget) {
                                mooruSprite.src = '../image/nyam(Happy).png';
                                trialScoreVal.innerText = "5";
                                triggerFloatText("+5", "#4ade80");
                            } else {
                                mooruSprite.src = '../image/ew.png';
                                trialScoreVal.innerText = "-5";
                                triggerFloatText("-5", "#ef4444");
                            }

                            setTimeout(() => {
                                mooruSprite.src = '../image/nyam2(Happy).png';
                            }, 1000);
                        }
                    }

                    if (topPos > arenaH) {
                        clearInterval(fall);
                        food.remove();
                    }
                }, 20);

            }, 2500);
        }

        function triggerFloatText(txt, color) {
            scoreFloat.innerText = txt;
            scoreFloat.style.color = color;
            scoreFloat.classList.add('show-float');
            setTimeout(() => scoreFloat.classList.remove('show-float'), 800);
        }
    </script>
</body>
</html>
