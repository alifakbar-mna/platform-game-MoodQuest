<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodQuest - Introduction</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/introduction-style.css">
</head>
<body>

    <div class="intro-wrapper">
        <div class="cloud-bubble">
            <div class="star-decoration">✦</div>

            <h2 class="intro-title">Welcome to<br>Mood Quest!</h2>
            
            <p class="intro-text">Hi, I'm Mooru, your emotional sidekick!</p>
            
            <div class="dots">. . .</div>
            
            <p class="intro-text">Let's unravel those feelings and conquer today together!</p>
        </div>

        <button class="next-btn" onclick="goToHome()">NEXT</button>
    </div>

    <script>
        // --- KONFIGURASI AUDIO GLOBAL AUDIO PERSISTENT ---
        const audioSrc = "../audio/music-bg.mp3";
        let bgm = new Audio(audioSrc);
        bgm.loop = true;

        // 1. Ambil data detik terakhir yang disimpan oleh index.html
        const savedTime = localStorage.getItem('bgm_current_time');
        if (savedTime) {
            bgm.currentTime = parseFloat(savedTime);
        }

        // 2. Lanjutkan pemutaran audio begitu mendeteksi interaksi user di halaman ini
        function continueBGM() {
            if (bgm.paused) {
                bgm.play().catch(err => console.log("Menunggu interaksi untuk melanjutkan audio:", err));
            }
        }
        window.addEventListener('click', continueBGM, { once: true });
        window.addEventListener('touchstart', continueBGM, { once: true });

        // 3. Sinkronisasikan durasi musik ke localStorage secara berkala (setiap 200 milidetik)
        setInterval(() => {
            if (!bgm.paused) {
                localStorage.setItem('bgm_current_time', bgm.currentTime);
            }
        }, 200);

        // 4. Cadangan: Simpan durasi audio jika user langsung me-refresh halaman
        window.addEventListener('beforeunload', () => {
            localStorage.setItem('bgm_current_time', bgm.currentTime);
        });

        // --- FUNGSI NAVIGASI PINDAH HALAMAN ---
        function goToHome() {
            // Kunci posisi detik terakhir sebelum berpindah ke homePage.html
            localStorage.setItem('bgm_current_time', bgm.currentTime);

            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease';
            setTimeout(() => {
                window.location.href = '../view/homePage.html';
            }, 500);
        }
    </script>
</body>
</html>
