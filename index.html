<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodQuest - Welcome</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/index-style.css">
</head>
<body>

    <div class="landing-container">
        <h1 class="mood-logo">
            <span class="mood-text">Mood Quest!</span>
        </h1>

        <div class="play-btn" onclick="goToIntro()">
            <div class="play-icon"></div>
        </div>
    </div>

    <img src="../image/maskot.png" alt="Mooru Peek" class="mooru-peek">

    <script>
        // --- KONFIGURASI AUDIO GLOBAL AUDIO PERSISTENT ---
        const audioSrc = "../audio/music-bg.mp3";
        let bgm = new Audio(audioSrc);
        bgm.loop = true;

        // 1. Periksa apakah ada catatan detik terakhir dari halaman sebelumnya jika user kembali ke menu utama
        const savedTime = localStorage.getItem('bgm_current_time');
        if (savedTime) {
            bgm.currentTime = parseFloat(savedTime);
        }

        // 2. Mengatasi kebijakan Autoplay Sandbox Browser:
        // Audio akan mulai diputar otomatis saat user menyentuh atau mengklik area mana saja di landing page.
        function startBGM() {
            if (bgm.paused) {
                bgm.play().catch(err => console.log("Menunggu interaksi user untuk memicu audio:", err));
            }
        }
        window.addEventListener('click', startBGM, { once: true });
        window.addEventListener('touchstart', startBGM, { once: true });

        // 3. Rekam kemajuan durasi lagu ke dalam localStorage secara berkala setiap 200ms
        setInterval(() => {
            if (!bgm.paused) {
                localStorage.setItem('bgm_current_time', bgm.currentTime);
            }
        }, 200);

        // 4. Cadangan aman: Paksa penyimpanan durasi track saat window menerima trigger unload / refresh
        window.addEventListener('beforeunload', () => {
            localStorage.setItem('bgm_current_time', bgm.currentTime);
        });

        // --- FUNGSI NAVIGASI PINDAH HALAMAN ---
        function goToIntro() {
            // Mengunci durasi lagu yang sedang berjalan sebelum halaman berganti
            localStorage.setItem('bgm_current_time', bgm.currentTime);

            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease';
            setTimeout(() => {
                window.location.href = '../view/introductionPage.html';
            }, 500);
        }
    </script>
</body>
</html>
