<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodQuest - Introduction</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/introduction-style.css">
</head>
<body>

    <div class="intro-wrapper">
        <div class="cloud-bubble">
            <div class="star-decoration">✦</div>

            <h2 class="intro-title">Welcome to<br>Mood Quest!</h2>
            
            <p class="intro-text">Hi, I'm Mooru, your emotional sidekick!</p>
            
            <div class="dots">. . .</div>
            
            <p class="intro-text">Let's unravel those feelings and conquer today together!</p>
        </div>

        <button class="next-btn" onclick="goToHome()">NEXT</button>
    </div>

    <script>
        function goToHome() {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease';
            setTimeout(() => {
                window.location.href = '../view/homePage.html';
            }, 500);
        }
        
        const bgMusic = new Audio("../audio/moodquest-bg.mp3");
        bgMusic.loop = true;
        bgMusic.volume = 0.4;

        // restore state
        const savedTime = localStorage.getItem("musicTime");
        const isPlaying = localStorage.getItem("musicPlaying");

        if (savedTime) {
            bgMusic.currentTime = parseFloat(savedTime);
        }

        // fungsi sync state
        function saveMusicState(){
            localStorage.setItem("musicTime", bgMusic.currentTime);
            localStorage.setItem("musicPlaying", "true");
        }

        // start music hanya setelah user interact
        function startMusic(){
            bgMusic.play().then(() => {
                saveMusicState();
            }).catch(()=>{});
        }

        // hanya sekali trigger
        document.addEventListener("click", startMusic, { once: true });

        // restore play state
        window.addEventListener("load", () => {
            if (isPlaying === "true") {
                bgMusic.play().catch(()=>{});
            }
        });

        // simpan progress berkala
        setInterval(() => {
            if (!bgMusic.paused) {
                localStorage.setItem("musicTime", bgMusic.currentTime);
                localStorage.setItem("musicPlaying", "true");
            }
        }, 500);

        // save saat keluar halaman (IMPORTANT)
        window.addEventListener("beforeunload", () => {
            localStorage.setItem("musicTime", bgMusic.currentTime);
        });
    </script>
</body>
</html>
