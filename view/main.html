<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodQuest</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>

    <audio id="global-bgm" src="audio/music-bg.mp3" loop></audio>

    <iframe id="game-viewport" src="index.html"></iframe>

    <script>
        const bgm = document.getElementById('global-bgm');

        // Fungsi global untuk memainkan musik (bisa dipanggil dari dalam iframe)
        function playGlobalMusic() {
            if (bgm.paused) {
                bgm.play().catch(err => console.log("Menunggu interaksi awal untuk audio:", err));
            }
        }

        // Fungsi global untuk menjeda musik (misal saat game dipause)
        function pauseGlobalMusic() {
            bgm.pause();
        }
    </script>
</body>
</html>
