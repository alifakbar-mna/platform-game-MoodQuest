<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angry Emotion Games - Victory</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/pageEmote_Angry2-style.css">
</head>
<body>
    <canvas id="fireworksCanvas"></canvas>

    <div class="victory-container">
        <div class="victory-card">
            <h1 class="victory-title">VICTORY!</h1>
            <p class="victory-subtitle">Amarah Mooru Berhasil Terbalaskan</p>

            <div class="mooru-victory-box">
                <img src="../image/angry/mooru-angry.png" class="mooru-victory-asset" alt="Mooru Angry Winner">
            </div>

            <div class="badge-container">
                <span class="badge-text">DEMON SLAYER</span>
            </div>

            <button class="btn-home" onclick="goToHome()">
                KEMBALI KE BERANDA
            </button>
        </div>
    </div>

    <script>
        // --- ANIMASI LATAR BELAKANG PARTIKEL API (FIREWORKS) ---
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        const colors = ['#ff4a4a', '#ff7a00', '#ffb800', '#ffdd00'];

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 4 + 2;
                this.speedX = Math.random() * 6 - 3;
                this.speedY = Math.random() * -6 - 2; // Meluncur ke atas
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += 0.05; // Efek gravitasi melambat
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function spawnParticles() {
            // Memunculkan partikel dari area bawah layar acak
            if (particles.length < 100 && Math.random() < 0.3) {
                const startX = Math.random() * canvas.width;
                for (let i = 0; i < 8; i++) {
                    particles.push(new Particle(startX, canvas.height));
                }
            }
        }

        function handleParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();

                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(11, 9, 20, 0.2)'; // Efek trail pudar berbayang
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            spawnParticles();
            handleParticles();
            requestAnimationFrame(animate);
        }

        // Jalankan animasi background api
        animate();

        // --- NAVIGASI ---
        function goToHome() {
            // Efek transisi pudar sebelum pindah page
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease';
            setTimeout(() => {
                window.location.href = '../view/homePage.html';
            }, 500);
        }
    </script>
</body>
</html>
