<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodQuest - Pat Mooru</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/pageEmote_Sad-style.css">
</head>
<body>

    <!-- PAUSE OVERLAY -->
    <div id="pauseOverlay" class="pause-overlay" onclick="togglePause()">
        <div class="pause-content">
            <p class="pause-title">GAME PAUSED</p>
            <p class="pause-sub">Klik di mana saja untuk melanjutkan</p>
        </div>
    </div>

    <!-- HEADER -->
    <header class="game-header">
        <h1 class="emotion-title">Sad</h1>

        <button
            class="pause-btn"
            onclick="event.stopPropagation(); togglePause();"
            title="Pause">

            <span class="pause-icon">||</span>
        </button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="instruction-container">

        <div class="swipe-arrow-wrapper">
            <img
                src="../image/swipe-arrow.png"
                alt="Swipe Arrow"
                class="swipe-arrow">
        </div>

        <h2 class="action-text">PAT!</h2>

        <p class="sub-instruction">
            swipe left and right repeatedly<br>
            to comfort mooru and make<br>
            him feel better
        </p>

    </main>

    <!-- FOOTER -->
    <footer class="game-footer">

        <button
            class="next-btn-corner"
            onclick="goNextPage()">

            NEXT
        </button>

    </footer>

    <script>
        let isPaused = false;

        const pauseOverlay = document.getElementById('pauseOverlay');

        function togglePause() {
            isPaused = !isPaused;

            if (isPaused) {
                pauseOverlay.classList.add('active');
            } else {
                pauseOverlay.classList.remove('active');
            }
        }

        function goNextPage() {
            if (isPaused) return;

            window.location.href = "pageEmote_Sad2.html";
        }
    </script>

</body>
</html>
