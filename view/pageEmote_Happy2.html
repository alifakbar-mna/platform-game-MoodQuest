<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Emotion Games - Playing</title>
    <link rel="stylesheet" href="style-base.css">
    <link rel="stylesheet" href="../css/pageEmote_Happy2-style.css">
</head>
<body>
    <div class="game-container" id="arena-container">
        
        <div class="game-hud">
            <div class="score-board">SCORE: <span id="score-val">0</span></div>
            <div class="wave-board">WAVE: <span id="wave-val">1/3</span></div>
        </div>

        <div class="sweets-bar-wrapper">
            <div class="sweets-box">
                <img src="../image/sweets_bar.png" class="bar-decor" alt="Bar">
                <span class="sweets-title">MOORU WANTS:</span>
                <div class="target-items-holder" id="target-list"></div>
            </div>
        </div>

        <div class="character-wrapper" id="game-mooru-container" style="bottom: 5vh;">
            <div class="floating-points" id="game-pop-points"></div>
            <img src="../image/nyam2.png" class="character" id="mooru-sprite" alt="Mooru">
        </div>

        <div class="picnic-mat"></div>
    </div>

    <script>
        const allItems = [
            { name: 'item1', img: '../image/item1.png' },
            { name: 'item2', img: '../image/item2.png' },
            { name: 'item3', img: '../image/item3.png' },
            { name: 'item4', img: '../image/item4.png' },
            { name: 'item5', img: '../image/item5.png' },
            { name: 'item6', img: '../image/item6.png' }
        ];

        let currentWave = 1;
        let score = 0;
        let targetItems = [];
        let gameActive = true;
        let spawnInterval;
        let mooruX = 50;

        const mooruContainer = document.getElementById('game-mooru-container');
        const mooruSprite = document.getElementById('mooru-sprite');
        const arena = document.getElementById('arena-container');
        const popPoints = document.getElementById('game-pop-points');

        const waveConfigs = {
            1: { targetScore: 25, speed: 4, spawnRate: 1600 },
            2: { targetScore: 50, speed: 6, spawnRate: 1200 },
            3: { targetScore: 100, speed: 9, spawnRate: 800 }
        };

        function generateTargetItems() {
            const shuffled = [...allItems].sort(() => 0.5 - Math.random());
            targetItems = shuffled.slice(0, 4);
            
            const listContainer = document.getElementById('target-list');
            listContainer.innerHTML = '';
            targetItems.forEach(item => {
                const img = document.createElement('img');
                img.src = item.img;
                img.classList.add('target-item-pic');
                listContainer.appendChild(img);
            });
        }

        document.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            if (e.key === 'ArrowLeft' && mooruX > 15) mooruX -= 5;
            if (e.key === 'ArrowRight' && mooruX < 85) mooruX += 5;
            mooruContainer.style.left = mooruX + '%';
        });

        function changeExpression(type, pointText) {
            popPoints.innerText = pointText;
            if (type === 'like') {
                mooruSprite.src = '../image/nyam.png';
                popPoints.className = 'floating-points plus-pop';
            } else {
                mooruSprite.src = '../image/ew.png';
                popPoints.className = 'floating-points minus-pop';
            }

            setTimeout(() => {
                if (gameActive) {
                    mooruSprite.src = '../image/nyam2.png';
                    popPoints.innerText = '';
                    popPoints.className = 'floating-points';
                }
            }, 1000);
        }

        function updateScore(amount) {
            score += amount;
            document.getElementById('score-val').innerText = score;

            if (score < 0) {
                gameActive = false;
                clearInterval(spawnInterval);
                window.location.href = '../view/pageEmote_Happy3.html';
                return;
            }

            let currentConfig = waveConfigs[currentWave];
            if (score >= currentConfig.targetScore) {
                if (currentWave < 3) {
                    currentWave++;
                    document.getElementById('wave-val').innerText = currentWave + '/3';
                    clearInterval(spawnInterval);
                    startWave();
                } else {
                    gameActive = false;
                    clearInterval(spawnInterval);
                    alert("Sempurna! Kamu Berhasil Menyelesaikan Semua Tantangan Wave!");
                    window.location.href = '../view/homePage.html';
                }
            }
        }

        function spawnFood() {
            if (!gameActive) return;

            const randomItem = allItems[Math.floor(Math.random() * allItems.length)];
            const foodElement = document.createElement('img');
            foodElement.src = randomItem.img;
            foodElement.classList.add('falling-object');
            
            const randomX = Math.floor(Math.random() * (80 - 20 + 1)) + 20;
            foodElement.style.left = randomX + '%';
            foodElement.style.top = '0px';
            arena.appendChild(foodElement);

            let currentTop = 0;
            let config = waveConfigs[currentWave];

            let fallTimer = setInterval(() => {
                if (!gameActive) {
                    clearInterval(fallTimer);
                    foodElement.remove();
                    return;
                }

                currentTop += config.speed;
                foodElement.style.top = currentTop + 'px';

                let arenaHeight = arena.clientHeight;
                if (currentTop >= arenaHeight - 140 && currentTop <= arenaHeight - 70) {
                    let foodXPercent = parseFloat(foodElement.style.left);
                    
                    if (Math.abs(foodXPercent - mooruX) < 8) {
                        clearInterval(fallTimer);
                        foodElement.remove();

                        const isMatch = targetItems.some(t => t.name === randomItem.name);
                        if (isMatch) {
                            changeExpression('like', '+5');
                            updateScore(5);
                        } else {
                            changeExpression('dislike', '-5');
                            updateScore(-5);
                        }
                    }
                }

                if (currentTop > arenaHeight) {
                    clearInterval(fallTimer);
                    foodElement.remove();

                    const isMatch = targetItems.some(t => t.name === randomItem.name);
                    if (isMatch) {
                        changeExpression('dislike', '-5');
                        updateScore(-5);
                    }
                }
            }, 20);
        }

        function startWave() {
            generateTargetItems();
            let config = waveConfigs[currentWave];
            spawnInterval = setInterval(spawnFood, config.spawnRate);
        }

        startWave();
    </script>
</body>
</html>
