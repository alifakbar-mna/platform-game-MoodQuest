<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Emotion Games - Playing</title>
    <link rel="stylesheet" href="../css/pageEmote_Happy2-style.css">
</head>
<body class="bg-pc">
    <div class="game-container play-screen">
        
        <div class="game-header">
            <div class="score-board">Score: <span id="score-val">0</span></div>
            <div class="wave-board">Wave: <span id="wave-val">1/3</span></div>
        </div>

        <div class="sweets-bar-container">
            <div class="sweets-bar-bg">
                <span class="bar-title">Mooru Wants:</span>
                <div id="target-items-list" class="target-list">
                    </div>
            </div>
        </div>

        <div class="arena" id="game-arena">
            <div class="picnic-carpet">
                <div class="mooru-game-char" id="player-mooru">
                    <img src="mangap.png" id="mooru-display" alt="Mooru">
                </div>
            </div>
        </div>

    </div>

    <script>
        // Data Master Aset Makanan
        const allItems = [
            { name: 'Cake', img: 'cake.png' },
            { name: 'Cookie 1', img: 'cookie1.png' },
            { name: 'Cookie 2', img: 'cookie2.png' },
            { name: 'Cupcake', img: 'cupcake.png' },
            { name: 'Donut', img: 'donut.png' },
            { name: 'Pudding', img: 'pudding.png' }
        ];

        // Status Game
        let currentWave = 1;
        let score = 0;
        let targetItems = [];
        let gameActive = true;
        let spawnInterval;
        
        // Konfigurasi Kesulitan per Wave
        const waveConfigs = {
            1: { targetScore: 25, speed: 3, spawnRate: 2000 },
            2: { targetScore: 50, speed: 5, spawnRate: 1500 },
            3: { targetScore: 100, speed: 7, spawnRate: 1000 }
        };

        const mooruContainer = document.getElementById('player-mooru');
        const mooruDisplay = document.getElementById('mooru-display');
        const arena = document.getElementById('game-arena');
        let mooruX = 50; // Posisi awal di tengah karpet (%)

        // 1. Pilih 4 item acak dari 6 item yang tersedia
        function generateTargetItems() {
            const shuffled = [...allItems].sort(() => 0.5 - Math.random());
            targetItems = shuffled.slice(0, 4);
            
            const targetContainer = document.getElementById('target-items-list');
            targetContainer.innerHTML = '';
            targetItems.forEach(item => {
                const img = document.createElement('img');
                img.src = item.img;
                img.alt = item.name;
                img.classList.add('target-icon');
                targetContainer.appendChild(img);
            });
        }

        // 2. Kontrol Gerakan Mooru (Keyboard)
        document.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            // Batasi Mooru hanya bisa bergeser di area karpet (rentang 30% - 70%)
            if (e.key === 'ArrowLeft' && mooruX > 32) mooruX -= 4;
            if (e.key === 'ArrowRight' && mooruX < 68) mooruX += 4;
            mooruContainer.style.left = mooruX + '%';
        });

        // 3. Logika Perubahan Ekspresi Wajah Mooru (1 Detik)
        function changeMooruExpression(type) {
            if (type === 'like') {
                mooruDisplay.src = 'like.png';
            } else if (type === 'dislike') {
                mooruDisplay.src = 'dislike.png';
            }
            
            // Kembalikan ke mangap.png setelah 1 detik
            setTimeout(() => {
                if (gameActive) mooruDisplay.src = 'mangap.png';
            }, 1000);
        }

        // 4. Update Skor dan Cek Transisi Wave / Kondisi Gagal
        function updateScore(amount) {
            score += amount;
            document.getElementById('score-val').innerText = score;

            // Jika skor di bawah 0, langsung lempar ke halaman Gagal
            if (score < 0) {
                gameOver();
                return;
            }

            // Cek apakah target wave terpenuhi
            let config = waveConfigs[currentWave];
            if (score >= config.targetScore) {
                if (currentWave < 3) {
                    currentWave++;
                    document.getElementById('wave-val').innerText = currentWave + '/3';
                    clearInterval(spawnInterval);
                    startWave(); // Mulai wave berikutnya secara otomatis
                } else {
                    // Berhasil menyelesaikan Wave 3 (Menang)
                    alert("Selamat! Kamu memenangkan semua wave!");
                    window.location.href = 'homePage.html';
                }
            }
        }

        function gameOver() {
            gameActive = false;
            clearInterval(spawnInterval);
            window.location.href = 'gameOverPage.html';
        }

        // 5. Spawn Makanan Jatuh
        function spawnFood() {
            if (!gameActive) return;
            
            // Ambil item random dari total 6 jenis makanan untuk dijatuhkan
            const randomItem = allItems[Math.floor(Math.random() * allItems.length)];
            const foodEl = document.createElement('img');
            foodEl.src = randomItem.img;
            foodEl.classList.add('falling-food');
            
            // Atur posisi X jatuh secara acak di area jalur karpet
            const minX = 32;
            const maxX = 68;
            const randomX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
            foodEl.style.left = randomX + '%';
            foodEl.style.top = '0px';
            arena.appendChild(foodEl);

            let currentTop = 0;
            let speed = waveConfigs[currentWave].speed;

            let fallTimer = setInterval(() => {
                if (!gameActive) {
                    clearInterval(fallTimer);
                    foodEl.remove();
                    return;
                }

                currentTop += speed;
                foodEl.style.top = currentTop + 'px';

                // Cek Tabrakan dengan Mooru (Mooru berada di bagian bawah arena)
                let arenaHeight = arena.clientHeight;
                if (currentTop >= arenaHeight - 90 && currentTop <= arenaHeight - 40) {
                    let foodXPercent = parseFloat(foodEl.style.left);
                    // Toleransi kedekatan koordinat X antara Mooru dan Makanan
                    if (Math.abs(foodXPercent - mooruX) < 8) {
                        clearInterval(fallTimer);
                        foodEl.remove();

                        // Cek apakah item ini termasuk dalam salah satu dari 4 target
                        const isTarget = targetItems.some(t => t.name === randomItem.name);
                        if (isTarget) {
                            changeMooruExpression('like');
                            updateScore(5);
                        } else {
                            changeMooruExpression('dislike');
                            updateScore(-5);
                        }
                    }
                }

                // Jika makanan lolos ke tanah bawah karpet
                if (currentTop > arenaHeight) {
                    clearInterval(fallTimer);
                    foodEl.remove();
                    
                    // Jika makanan yang terlewat adalah target yang diminta, kurangi poin
                    const isTarget = targetItems.some(t => t.name === randomItem.name);
                    if (isTarget) {
                        changeMooruExpression('dislike');
                        updateScore(-5);
                    }
                }
            }, 20);
        }

        // 6. Inisialisasi Jalannya Game
        function startWave() {
            generateTargetItems();
            let config = waveConfigs[currentWave];
            spawnInterval = setInterval(spawnFood, config.spawnRate);
        }

        // Jalankan game saat halaman terbuka
        startWave();
    </script>
</body>
</html>
