<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodQuest - Fear Zone Coming Soon</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0c1d; /* Warna gelap misterius */
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #94a3b8;
        }

        /* Latar Belakang Atmosfer Kabut/Misterius */
        .fear-bg-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.15) 0%, rgba(13, 12, 29, 1) 80%);
            z-index: 1;
        }

        .container {
            text-align: center;
            z-index: 2;
            padding: 20px;
        }

        /* Logo Maskot atau Ikon Fear (Spooky Glow Effect) */
        .fear-icon-wrapper {
            margin-bottom: 30px;
            position: relative;
            animation: floatAnimation 3s ease-in-out infinite alternate;
        }

        .fear-icon {
            width: 120px;
            height: 120px;
            filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.6));
        }

        /* Teks Utama dengan Efek Glitch/Berkedip */
        .title-fear {
            font-size: 28px;
            color: #a855f7; /* Warna ungu khas Fear/Spooky */
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
            margin-bottom: 20px;
            line-height: 1.4;
            animation: spookyBlink 2s infinite alternate;
        }

        .subtitle {
            font-size: 12px;
            color: #64748b;
            line-height: 2;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        /* Tombol Kembali dengan Gaya Pixel Art */
        .back-btn {
            background-color: #1e1b4b;
            color: #c084fc;
            border: 4px solid #a855f7;
            padding: 15px 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 6px 0 #6b21a8;
            transition: all 0.1s ease;
        }

        .back-btn:hover {
            background-color: #2e1065;
            color: #f3e8ff;
            box-shadow: 0 4px 0 #6b21a8;
            transform: translateY(2px);
        }

        .back-btn:active {
            box-shadow: 0 0px 0 #6b21a8;
            transform: translateY(6px);
        }

        /* --- ANIMASI --- */
        @keyframes floatAnimation {
            from { transform: translateY(0px); }
            to { transform: translateY(-15px); }
        }

        @keyframes spookyBlink {
            0%, 100% { opacity: 1; filter: brightness(1); }
            90% { opacity: 1; }
            92% { opacity: 0.3; filter: brightness(0.5); }
            94% { opacity: 1; }
            96% { opacity: 0.5; }
            98% { opacity: 1; }
        }

        @media (max-width: 768px) {
            .title-fear { font-size: 18px; }
            .subtitle { font-size: 9px; }
            .fear-icon { width: 90px; height: 90px; }
            .back-btn { font-size: 10px; padding: 12px 24px; }
        }
    </style>
</head>
<body>

    <div class="fear-bg-overlay"></div>

    <div class="container">
        <div class="fear-icon-wrapper">
            <img src="../image/maskot.png" alt="Mooru Fear" class="fear-icon" onerror="this.src='https://img.icons8.com/pixel-cyfi/96/a855f7/ghost.png'">
        </div>

        <h1 class="title-fear">FEAR STAGE<br>COMING SOON</h1>
        
        <p class="subtitle">Mooru sedang mempersiapkan mental<br>untuk menghadapi ketakutan ini . . .</p>

        <button class="back-btn" onclick="goBackToHome()">KEMBALI</button>
    </div>

    <script>
        function goBackToHome() {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease';
            
            setTimeout(() => {
                // Integrasi Master-Iframe: Mengganti isi src iframe agar BGM tidak putus
                if (window.parent && window.parent.document.getElementById('game-viewport')) {
                    // Sesuaikan path 'view/homePage.html' atau 'homePage.html' tergantung posisi main.html Anda
                    window.parent.document.getElementById('game-viewport').src = 'view/homePage.html';
                } else {
                    // Cadangan jika diakses tanpa main.html
                    window.location.href = 'homePage.html';
                }
            }, 500);
        }
    </script>
</body>
</html>
