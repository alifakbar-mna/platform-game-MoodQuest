<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Emotion Games - Gameplay</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/pageEmote_Happy2-style.css">
</head>
<body>
    <!-- Fitur Pause Overlay -->
    <div id="pauseOverlay" class="pause-overlay" onclick="togglePause()">
        <div class="pause-content">
            <p class="pause-title">GAME PAUSED</p>
            <p class="pause-sub">Klik di mana saja untuk melanjutkan</p>
        </div>
    </div>
    
    <div class="game-container" id="arena-container">
        <!-- Tombol Pause Bentuk Awan di Pojok Kanan Atas -->
        <button class="pause-btn" onclick="event.stopPropagation(); togglePause();" title="Pause">
            <span class="pause-icon">||</span>
        </button>
        
        <!-- Scorecard di Pojok Kiri Bawah -->
        <div class="game-hud">
            <div>SCORE: <span id="score-val">0</span></div>
            <div>WAVE: <span id="wave-val">1/3</span></div>
        </div>

        <div class="sweets-bar-wrapper">
            <img src="../image/sweets_bar.png" class="sweets-bar-bg" alt="Sweets Bar">
            <div class="target-items-holder" id="target-list"></div>
        </div>

        <div id="game-score-float" class="score-float"></div>

        <!-- Touch Action dinonaktifkan agar browser tidak melakukan scroll saat Mooru ditarik -->
        <div class="character-wrapper" id="game-mooru-container" style="touch-action: none;">
            <img src="../image/happyWin.png" class="character" id="mooru-sprite" alt="Mooru">
        </div>

    </div>

    <script>
        const allItems = [
            { name: 'item1', img: '../image/item1.png' },
            { name: 'item2', img: '../image/item2.png' },
            { name: 'item3', img: '../image/item3.png' },
            { name: 'item4', img: '../image/item4.png' },
            { name: 'item5', img: '../image/item5.png' },
            { name: 'item6', img: '../image/item6.png' }
        ];

        let currentWave = 1;
        let score = 0;
        let targetItems = [];
        let gameActive = true;
        let isPaused = false; 
        let spawnInterval;
        let mooruX = 50; 

        // State pendukung kontrol seret (drag) pada HP
        let isDragging = false;
        let startTouchX = 0;
        let startMooruX = 0;

        const mooruContainer = document.getElementById('game-mooru-container');
        const mooruSprite = document.getElementById('mooru-sprite');
        const arena = document.getElementById('arena-container');
        const floatText = document.getElementById('game-score-float');
        const pauseOverlay = document.getElementById('pauseOverlay');

        const waveConfigs = {
            1: { targetScore: 25, speed: 5, spawnRate: 1800 },
            2: { targetScore: 50, speed: 7, spawnRate: 1300 },
            3: { targetScore: 100, speed: 10, spawnRate: 900 }
        };

        function generateTargetItems() {
            const shuffled = [...allItems].sort(() => 0.5 - Math.random());
            targetItems = shuffled.slice(0, 4);
            
            const listContainer = document.getElementById('target-list');
            listContainer.innerHTML = '';
            targetItems.forEach(item => {
                const img = document.createElement('img');
                img.src = item.img;
                img.classList.add('target-item-pic');
                listContainer.appendChild(img);
            });
        }

        // --- SISTEM GERAK LAPTOP (KEYBOARD) ---
        document.addEventListener('keydown', (e) => {
            if (!gameActive || isPaused) return;
            if (e.key === 'ArrowLeft' && mooruX > 12) mooruX -= 4;
            if (e.key === 'ArrowRight' && mooruX < 88) mooruX += 4;
            mooruContainer.style.left = mooruX + '%';
        });

        // --- SISTEM GERAK HP (TOUCH SLIDE / DRAG) ---
        mooruContainer.addEventListener('touchstart', (e) => {
            if (!gameActive || isPaused) return;
            isDragging = true;
            startTouchX = e.touches[0].clientX;
            
            const arenaWidth = window.innerWidth;
            const containerLeftPx = mooruContainer.getBoundingClientRect().left + (mooruContainer.offsetWidth / 2);
            startMooruX = (containerLeftPx / arenaWidth) * 100;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging || !gameActive || isPaused) return;

            const currentTouchX = e.touches[0].clientX;
            const deltaX = currentTouchX - startTouchX;
            const arenaWidth = window.innerWidth;

            const deltaPercent = (deltaX / arenaWidth) * 100;
            let newX = startMooruX + deltaPercent;

            // Batas area gerak agar tidak keluar layar HP
            if (newX < 12) newX = 12;
            if (newX > 88) newX = 88;

            mooruX = newX;
            mooruContainer.style.left = mooruX + '%';
        });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        function changeExpression(type) {
            if (type === 'like') {
                mooruSprite.src = '../image/nyam(Happy).png';
                triggerFloatText("+5", "#4ade80");
            } else if (type === 'dislike') {
                mooruSprite.src = '../image/ew.png';
                triggerFloatText("-5", "#ef4444");
            }

            setTimeout(() => {
                if (gameActive) mooruSprite.src = '../image/happyWin.png';
            }, 1000);
        }

        function triggerFloatText(txt, color) {
            floatText.innerText = txt;
            floatText.style.color = color;
            floatText.style.left = mooruX + '%';
            floatText.classList.add('show-float');
            setTimeout(() => floatText.classList.remove('show-float'), 800);
        }

        function updateScore(amount) {
            score += amount;
            document.getElementById('score-val').innerText = score;

            if (score < 0) {
                triggerGameOver();
                return;
            }

            let currentConfig = waveConfigs[currentWave];
            if (score >= currentConfig.targetScore) {
                if (currentWave < 3) {
                    currentWave++;
                    document.getElementById('wave-val').innerText = currentWave + '/3';
                    clearInterval(spawnInterval);
                    startWave(); 
                } else {
                    gameActive = false;
                    clearInterval(spawnInterval);
                    alert("Luar Biasa! Kamu memenangkan permainan!");
                    window.location.href = '../view/homePage.html';
                }
            }
        }

        function triggerGameOver() {
            gameActive = false;
            clearInterval(spawnInterval);
            window.location.href = '../view/pageEmote_Happy3.html';
        }

        function spawnFood() {
            if (!gameActive || isPaused) return; 

            const randomItem = allItems[Math.floor(Math.random() * allItems.length)];
            const foodElement = document.createElement('img');
            foodElement.src = randomItem.img;
            foodElement.classList.add('falling-object');
            
            const randomX = Math.floor(Math.random() * (80 - 20 + 1)) + 20;
            foodElement.style.left = randomX + '%';
            foodElement.style.top = '0px';
            arena.appendChild(foodElement);

            let currentTop = 0;
            let config = waveConfigs[currentWave];

            let fallTimer = setInterval(() => {
                if (!gameActive) {
                    clearInterval(fallTimer);
                    foodElement.remove();
                    return;
                }

                if (isPaused) return;

                currentTop += config.speed;
                foodElement.style.top = currentTop + 'px';

                let arenaHeight = arena.clientHeight;
                if (currentTop >= arenaHeight - 140 && currentTop <= arenaHeight - 70) {
                    let foodXPercent = parseFloat(foodElement.style.left);
                    
                    if (Math.abs(foodXPercent - mooruX) < 10) {
                        clearInterval(fallTimer);
                        foodElement.remove();

                        const isMatch = targetItems.some(t => t.name === randomItem.name);
                        if (isMatch) {
                            changeExpression('like');
                            updateScore(5);
                        } else {
                            changeExpression('dislike');
                            updateScore(-5);
                        }
                    }
                }

                if (currentTop > arenaHeight) {
                    clearInterval(fallTimer);
                    foodElement.remove();

                    const isMatch = targetItems.some(t => t.name === randomItem.name);
                    if (isMatch) {
                        changeExpression('dislike');
                        updateScore(-5);
                    }
                }
            }, 20);
        }

        function togglePause() {
            if (!gameActive) return;
            isPaused = !isPaused;
            if (isPaused) {
                pauseOverlay.classList.add('active');
            } else {
                pauseOverlay.classList.remove('active');
            }
        }

        function startWave() {
            generateTargetItems();
            let config = waveConfigs[currentWave];
            spawnInterval = setInterval(spawnFood, config.spawnRate);
        }

        startWave();
    </script>
</body>
</html>
