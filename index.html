<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodQuest - Welcome</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/index-style.css">
</head>
<body>

    <div class="landing-container">
        <h1 class="mood-logo">
            <span class="mood-text">Mood Quest!</span>
        </h1>

        <div class="play-btn" onclick="goToIntro()">
            <div class="play-icon"></div>
        </div>
    </div>

    <img src="../image/maskot.png" alt="Mooru Peek" class="mooru-peek">

    <script>
        function goToIntro() {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease';
            setTimeout(() => {
                window.location.href = 'introductionPage.html';
            }, 500);
        }
    </script>
</body>
</html>
